version: '3.8'

services:
  # PostgreSQL数据库
  db:
    image: postgres:16-alpine
    container_name: xianyu-db
    environment:
      POSTGRES_USER: xianyu
      POSTGRES_PASSWORD: xianyu2026
      POSTGRES_DB: xianyu_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xianyu -d xianyu_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: xianyu-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # 后端API服务
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: xianyu-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://xianyu:xianyu2026@db:5432/xianyu_saas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-this}
      DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # 前端服务 (开发模式)
  frontend:
    image: node:20-alpine
    container_name: xianyu-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  redis_data:
